<script>
  function showError(msg) {
    var root = document.getElementById('root');
    if (root) {
      root.innerHTML = '<pre style="white-space:pre-wrap;padding:16px;color:#A8322A;font-family:monospace;font-size:13px;">' + msg + '</pre>';
    }
  }
  window.addEventListener('error', function (e) {
    showError('Error: ' + (e.message || (e.error && e.error.message) || 'desconocido'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var reason = e.reason;
    showError('Error: ' + (reason && reason.message ? reason.message : String(reason)));
  });
</script>

function makeIcon(emoji) {
  return function IconComp({ size, color, style, className, title }) {
    return React.createElement(
      "span",
      {
        className,
        title,
        style: {
          fontSize: size || 16,
          lineHeight: 1,
          display: "inline-block",
          color: color,
          filter: color ? "none" : undefined,
          ...(style || {}),

  };
}

function upsertPerson(list, person) {
  const idx = (list || []).findIndex((p) => p.id === person.id);
  if (idx === -1) return [...(list || []), person];
  const next = [...list];
  next[idx] = { ...next[idx], ...person };
  return next;
}

const MAX_TASK_POINTS = 40;

function getTotalEarned(data, userId) {
  const fromTasks = data.submissions
    .filter((s) => s.studentId === userId && s.status === "aprobado")
    .reduce((sum, s) => sum + s.points, 0);
  const fromGrants = (data.grants || []).filter((g) => g.toId === userId).reduce((sum, g) => sum + g.amount, 0);
  const fromTransfers = (data.transfers || []).filter((t) => t.toId === userId).reduce((sum, t) => sum + t.amount, 0);
  return fromTasks + fromGrants + fromTransfers;
}

const RANKS = [
  { min: 0, name: "Aprendiz", icon: "\u{1F331}" },
  { min: 50, name: "Constante", icon: "\u{1F4D8}" },
  { min: 150, name: "Destacado", icon: "\u{2B50}" },
  { min: 300, name: "Experto", icon: "\u{1F525}" },
  { min: 600, name: "Maestro", icon: "\u{1F3C6}" },
  { min: 1000, name: "Leyenda", icon: "\u{1F451}" },
];

function getRank(total) {
  let current = RANKS[0];
  for (const r of RANKS) if (total >= r.min) current = r;
  const idx = RANKS.indexOf(current);
  const next = RANKS[idx + 1];
  return { ...current, next, progress: next ? (total - current.min) / (next.min - current.min) : 1 };
}

  { id: "centurion", name: "Centurión", icon: "\u{1F4AF}", desc: "100 puntos ganados en total", check: (data, uid_) => getTotalEarned(data, uid_) >= 100 },
];

function getBalance(data, userId) {
  const earned = data.submissions
    .filter((s) => s.studentId === userId && s.status === "aprobado")
    .reduce((sum, s) => sum + s.points, 0);
  const granted = (data.grants || [])
    .filter((g) => g.toId === userId)
    .reduce((sum, g) => sum + g.amount, 0);
  const received = (data.transfers || [])
    .filter((t) => t.toId === userId)
    .reduce((sum, t) => sum + t.amount, 0);
  const sent = (data.transfers || [])
    .filter((t) => t.fromId === userId)
    .reduce((sum, t) => sum + t.amount, 0);
  const spent = data.redemptions
    .filter((r) => r.studentId === userId && r.status !== "rechazado")
    .reduce((sum, r) => sum + r.cost, 0);
  return earned + granted + received - sent - spent;
}

const USER_STORAGE_KEY = "libro-puntos-sesion";
const DATA_STORAGE_KEY = "libro-puntos-datos";

function loadCachedData() {
  try {
    const saved = localStorage.getItem(DATA_STORAGE_KEY);
    return saved ? JSON.parse(saved) : null;
  } catch {
    return null;
  }
}

function cacheData(next) {
  try {
    localStorage.setItem(DATA_STORAGE_KEY, JSON.stringify(next));
  } catch {}
}

function App() {
  const [data, setData] = useState(() => loadCachedData());
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [user, setUser] = useState(() => {
    try {
      const saved = localStorage.getItem(USER_STORAGE_KEY);
      return saved ? JSON.parse(saved) : null;
    } catch {
      return null;
    }
  });

  useEffect(() => {
    const unsub = DOC_REF.onSnapshot(
      (snap) => {
        if (snap.exists) {
          setData(snap.data());
          cacheData(snap.data());
          setError(null);
        } else {
          const initial = loadCachedData() || defaultData();
          DOC_REF.set(initial).catch(() => {});
          setData(initial);
          cacheData(initial);
        }
        setLoading(false);
      },
      () => {
        const cached = loadCachedData();
        setError(
          cached
            ? "No se pudo conectar con Firebase. Mostrando tu última copia guardada en este dispositivo; los cambios no se compartirán hasta que vuelva la conexión."
            : "No se pudo conectar con Firebase. Revisa la configuración."
        );
        setData(cached || defaultData());
        setLoading(false);
      }
    );
    return () => unsub();
  }, []);

  const persist = useCallback(async (next) => {
    setData(next);
    cacheData(next);
    try {
      await DOC_REF.set(next);
      setError(null);
    } catch {
      setError("No se pudo guardar en Firebase (posible problema de permisos). Se guardó una copia en este dispositivo, pero avísale al administrador para revisar las reglas de Firestore.");
    }
  }, []);

  const handleEnter = useCallback(
    (u) => {
      const sessionUser = { id: u.id, name: u.name, role: u.role };
      setUser(sessionUser);
      try {
        localStorage.setItem(USER_STORAGE_KEY, JSON.stringify(sessionUser));
      } catch {}
      const personRecord =
        u.role === "estudiante"
          ? { id: u.id, name: u.name, role: u.role, password: u.password }
          : { id: u.id, name: u.name, role: u.role };
      persist({
        ...data,
        people: upsertPerson(data.people, personRecord),
      });
    },
    [data, persist]
  );

  const handleLogout = useCallback(() => {
    setUser(null);
    try {
      localStorage.removeItem(USER_STORAGE_KEY);
    } catch {}
  }, []);

  if (loading || !data) {
    return (
      <div
        style={{ ...font.body, background: COLORS.paper, color: COLORS.ink }}
        className="min-h-screen flex items-center justify-center"
      >
        <div className="flex items-center gap-3">
          <Stamp className="animate-pulse" size={28} />
          <span>Cargando Ubeetareas…</span>
        </div>
      </div>
    );
  }

  return (
    <div style={{ ...font.body, background: COLORS.paper, minHeight: "100vh" }}>
      {!user ? (
        <Login onEnter={handleEnter} people={data.people} />
      ) : (
        <Dashboard user={user} data={data} setData={persist} onLogout={handleLogout} error={error} />
      )}
    </div>
  );
}

/* ---------------- LOGIN ---------------- */

function Login({ onEnter, people }) {
  const [role, setRole] = useState("estudiante");
  const [name, setName] = useState("");
  const [password, setPassword] = useState("");
  const [pwError, setPwError] = useState(false);
  const [pwErrorMsg, setPwErrorMsg] = useState("Contraseña incorrecta.");

  const roles = [
    { id: "dueno", label: "Dueño", icon: Crown, desc: "Administra maestros y premios" },
    { id: "maestro", label: "Maestro", icon: GraduationCap, desc: "Crea tareas y da puntos" },
    { id: "estudiante", label: "Estudiante", icon: Users, desc: "Entrega tareas y canjea premios" },
  ];

  // Todos los roles piden contraseña: dueño y maestro comparten una clave fija,
  // y cada estudiante crea la suya propia la primera vez que entra con su nombre.
  const needsPassword = true;

  const studentId = normId(name);
  const existingStudent =
    role === "estudiante" && studentId ? (people || []).find((p) => p.id === studentId && p.role === "estudiante") : null;
  const isNewStudentAccount = role === "estudiante" && !!studentId && !existingStudent;

  const submit = () => {
    if (!name.trim()) return;

    if (role === "dueno" || role === "maestro") {
      const expected = role === "dueno" ? OWNER_PASSWORD : TEACHER_PASSWORD;
      if (password !== expected) {
        setPwErrorMsg("Contraseña incorrecta.");
        setPwError(true);
        return;
      }
      onEnter({ id: role === "dueno" ? "dueno" : normId(name), name: name.trim(), role });
      return;
    }

    // role === "estudiante": cada cuenta de estudiante queda protegida por su propia contraseña.
    if (existingStudent && existingStudent.password) {
      if (password !== existingStudent.password) {
        setPwErrorMsg("Contraseña incorrecta. Si esta cuenta ya es tuya, escribe la contraseña que creaste antes.");
        setPwError(true);
        return;
      }
    } else {
      if (!password || password.trim().length < 4) {
        setPwErrorMsg("Crea una contraseña de al menos 4 caracteres para proteger tu cuenta.");
        setPwError(true);
        return;
      }
    }
    onEnter({ id: studentId, name: name.trim(), role, password });
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-4 py-10">
      <div className="w-full max-w-md">
        <div className="mb-8 text-center">
          <h1
            style={{
              ...font.display,
              color: COLORS.ink,
              fontWeight: 700,
              fontSize: "clamp(48px, 14vw, 88px)",
              lineHeight: 0.88,
              letterSpacing: "-0.03em",
            }}
          >
            Ubeet<span style={{ color: COLORS.gold }}>areas</span>
          </h1>
          <p style={{ ...font.mono, fontSize: 11, color: COLORS.inkSoft, letterSpacing: 3 }} className="uppercase mt-3">
            Tareas · mérito · recompensas
          </p>
        </div>

        <div
          className="rounded-lg p-6"
          style={{ background: COLORS.paperDark, border: `1px solid ${COLORS.line}`, boxShadow: SHADOW }}
        >
          <p style={{ ...font.mono, fontSize: 12, color: COLORS.inkSoft, letterSpacing: 1 }} className="mb-3 uppercase">
            Elige tu rol
          </p>
          <div className="grid grid-cols-1 gap-2 mb-5">
            {roles.map((r) => {
              const Icon = r.icon;
              const active = role === r.id;
              return (
                <button
                  key={r.id}
                  onClick={() => {
                    setRole(r.id);
                    setPassword("");
                    setPwError(false);
                  }}
                  className="flex items-center gap-3 p-3 rounded-md text-left transition"
                  style={{
                    border: `1px solid ${active ? COLORS.green : COLORS.line}`,
                    background: active ? COLORS.paperDark : "transparent",
                  }}
                >
                  <Icon size={20} color={active ? COLORS.green : COLORS.inkSoft} />
                  <div className="flex-1">
                    <div style={{ color: COLORS.ink, fontWeight: 600, fontSize: 14 }}>{r.label}</div>
                    <div style={{ color: COLORS.inkSoft, fontSize: 12 }}>{r.desc}</div>
                  </div>
                  <Lock size={13} color={COLORS.inkSoft} />
                </button>
              );
            })}
          </div>

          <label style={{ ...font.mono, fontSize: 12, color: COLORS.inkSoft, letterSpacing: 1 }} className="uppercase block mb-1">
            Tu nombre
          </label>
          <input
            value={name}
            onChange={(e) => setName(e.target.value)}
            placeholder="Escribe tu nombre"
            className="w-full p-3 rounded-md mb-4 outline-none"
            style={inputStyle}
          />

          {needsPassword && (
            <div className="mb-4">
              <label style={{ ...font.mono, fontSize: 12, color: COLORS.inkSoft, letterSpacing: 1 }} className="uppercase block mb-1">
                {role === "estudiante" ? "Tu contraseña" : "Contraseña de acceso"}
              </label>
              <div className="relative">
                <Lock size={15} color={COLORS.inkSoft} style={{ position: "absolute", left: 12, top: 13 }} />
                <input
                  type="password"
                  value={password}
                  onChange={(e) => {
                    setPassword(e.target.value);
                    setPwError(false);
                  }}
                  placeholder={isNewStudentAccount ? "Crea una contraseña" : "Contraseña"}
                  className="w-full p-3 pl-9 rounded-md outline-none"
                  style={{ ...inputStyle, border: `1px solid ${pwError ? COLORS.red : COLORS.line}` }}
                />
              </div>
              {pwError ? (
                <p style={{ color: COLORS.red, fontSize: 12 }} className="mt-1">
                  {pwErrorMsg}
                </p>
              ) : role === "estudiante" && studentId ? (
                <p style={{ color: COLORS.inkSoft, fontSize: 11 }} className="mt-1">
                  {isNewStudentAccount
                    ? "Es la primera vez que se usa este nombre: la contraseña que escribas quedará guardada para esta cuenta."
                    : "Ya existe una cuenta con este nombre. Escribe la contraseña de esa cuenta para entrar."}
                </p>
              ) : null}
            </div>
          )}

          <button disabled={!name.trim()} onClick={submit} className="w-full p-3 rounded-md font-medium transition" style={primaryBtnStyle(!!name.trim())}>
            Entrar
          </button>
        </div>
      </div>
    </div>
  );
}

function MessagesTab({ data, setData, user }) {
  const [activeId, setActiveId] = useState(null);
  const [text, setText] = useState("");
  const people = (data.people || []).filter((p) => p.id !== user.id);
  const messages = data.messages || [];

  const threadWith = (pid) =>
    messages.filter((m) => (m.fromId === user.id && m.toId === pid) || (m.fromId === pid && m.toId === user.id)).sort((a, b) => a.at - b.at);

  const lastMsg = (pid) => {
    const t = threadWith(pid);
    return t[t.length - 1];
  };

  const send = () => {
    if (!text.trim() || !activeId) return;
    const person = people.find((p) => p.id === activeId);
    const msg = { id: uid(), fromId: user.id, fromName: user.name, toId: activeId, toName: person.name, text: text.trim(), at: Date.now() };
    setData({ ...data, messages: [...messages, msg] });
    setText("");
  };

  if (activeId) {
    const person = people.find((p) => p.id === activeId);
    const thread = threadWith(activeId);
    return (
      <div>
        <button onClick={() => setActiveId(null)} className="mb-3 text-sm" style={{ color: COLORS.inkSoft }}>
          &larr; Volver
        </button>
        <Eyebrow>{person ? person.name : "Conversación"}</Eyebrow>
        <div className="mb-3" style={{ maxHeight: 420, overflowY: "auto" }}>
          {thread.length === 0 && <EmptyState icon={Send} text="Todavía no hay mensajes. Escribe el primero." />}
          {thread.map((m) => (
            <div key={m.id} className="mb-2 flex" style={{ justifyContent: m.fromId === user.id ? "flex-end" : "flex-start" }}>
              <div
                className="px-3 py-2 rounded-lg"
                style={{
                  maxWidth: "75%",
                  background: m.fromId === user.id ? COLORS.green : COLORS.paperDark,
                  color: m.fromId === user.id ? COLORS.white : COLORS.ink,
                  border: m.fromId === user.id ? "none" : `1px solid ${COLORS.line}`,
                  fontSize: 13,
                }}
              >
                {m.text}
              </div>
            </div>
          ))}
        </div>
        <div className="flex gap-2">
          <input
            value={text}
            onChange={(e) => setText(e.target.value)}
            placeholder="Escribe un mensaje..."
            className="flex-1 p-3 rounded-md outline-none"
            style={inputStyle}
            onKeyDown={(e) => {
              if (e.key === "Enter") send();
            }}
          />
          <button onClick={send} className="px-4 py-3 rounded-md" style={primaryBtnStyle(!!text.trim())}>
            <Send size={15} />
          </button>
        </div>
      </div>
    );
  }

  return (
    <div>
      <Eyebrow>Mensajes</Eyebrow>
      {people.length === 0 && <EmptyState icon={Send} text="Todavía no hay nadie más registrado." />}
      {people.map((p) => {
        const last = lastMsg(p.id);
        return (
          <Card key={p.id} style={{ cursor: "pointer" }}>
            <div onClick={() => setActiveId(p.id)} className="flex items-center justify-between gap-2">
              <div>
                <div style={{ ...font.display, color: COLORS.ink, fontSize: 15, fontWeight: 700 }}>{p.name}</div>
                <div style={{ color: COLORS.inkSoft, fontSize: 12 }}>{last ? last.text.slice(0, 42) : "Sin mensajes todavía"}</div>
              </div>
              <div style={{ ...font.mono, fontSize: 10, color: COLORS.inkSoft }} className="uppercase">
                {ROLE_LABEL[p.role]}
              </div>
            </div>
          </Card>
        );
      })}

  );
}

/* ---------------- LEADERBOARD ---------------- */

function periodStart(period) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  if (period === "week") {
    const day = d.getDay();
    const diff = day === 0 ? 6 : day - 1;
    d.setDate(d.getDate() - diff);
  } else if (period === "month") {
    d.setDate(1);
  }
  return d.getTime();
}

function getEarnedInPeriod(data, userId, since) {
  const fromTasks = data.submissions
    .filter((s) => s.studentId === userId && s.status === "aprobado" && (s.reviewedAt || s.at) >= since)
    .reduce((sum, s) => sum + s.points, 0);
  const fromGrants = (data.grants || [])
    .filter((g) => g.toId === userId && g.at >= since)
    .reduce((sum, g) => sum + g.amount, 0);
  const fromTransfers = (data.transfers || [])
    .filter((t) => t.toId === userId && t.at >= since)
    .reduce((sum, t) => sum + t.amount, 0);
  return fromTasks + fromGrants + fromTransfers;
}

const PODIUM_RING = [COLORS.gold, "#C7CBD6", "#C97A3D"];

function LeaderboardTab({ data, user }) {
  const [period, setPeriod] = useState("week");

  const ranked = (data.people || [])
    .filter((p) => p.role === "estudiante")
    .map((p) => ({ ...p, pts: getEarnedInPeriod(data, p.id, since) }))
    .sort((a, b) => b.pts - a.pts);

  const top3 = ranked.slice(0, 3);
  const rest = ranked.slice(3);
  const podiumOrder = top3.length === 3 ? [top3[1], top3[0], top3[2]] : top3;

  const periods = [
    { id: "today", label: "Hoy" },
    { id: "week", label: "Semana" },

  return (
    <div>
      <div className="flex gap-1 mb-5 p-1 rounded-lg" style={{ background: COLORS.paperDark, border: `1px solid ${COLORS.line}` }}>
        {periods.map((p) => (

            onClick={() => setPeriod(p.id)}

          >
            {p.label}
          </button>
        ))}
      </div>

      {ranked.length === 0 && <EmptyState icon={Crown} text="Todavía no hay estudiantes con puntos en este periodo." />}

      {top3.length > 0 && (
        <div className="flex items-end justify-center gap-3 mb-5 pt-2">
          {podiumOrder.map((p) => {
            if (!p) return null;
            const place = top3.indexOf(p) + 1;

            return (
              <div key={p.id} className="flex flex-col items-center" style={{ width: 84 }}>
                {place === 1 && <Crown size={18} color={COLORS.gold} style={{ marginBottom: 2 }} />}

                <div style={{ color: COLORS.ink, fontSize: 12, fontWeight: 600, textAlign: "center", width: "100%" }} className="mt-1 truncate">
                  {p.name}
                </div>
                <div style={{ ...font.mono, color: COLORS.gold, fontSize: 11 }}>{p.pts} pts</div>
                <div
                  className="mt-1 rounded-t-md w-full flex items-start justify-center pt-1"
                  style={{ height, background: COLORS.paperDark, border: `1px solid ${COLORS.line}`, borderBottom: "none" }}
                >
                  <span style={{ ...font.display, color: COLORS.inkSoft, fontWeight: 700, fontSize: 18 }}>{place}</span>
                </div>

      {rest.map((p, i) => {

const ROLE_LABELS = { dueno: "Dueño", maestro: "Maestros", estudiante: "Estudiantes" };

function PeopleTab({ data, setData, user }) {
  const [openId, setOpenId] = useState(null);
  const [amount, setAmount] = useState("");
  const [formError, setFormError] = useState("");

  const isGranter = user.role === "maestro" || user.role === "dueno";
  const balance = getBalance(data, user.id);
  const people = (data.people || []).filter((p) => p.id !== user.id);
  const follows = data.follows || [];

  const followingSet = new Set(follows.filter((f) => f.followerId === user.id).map((f) => f.followingId));
  const followerCount = follows.filter((f) => f.followingId === user.id).length;

  const isOwner = user.role === "dueno";

  const deletePerson = (person) => {
    if (!window.confirm(`¿Eliminar a ${person.name} de la lista? Su historial de tareas y puntos ya ganados no se borra, pero dejará de aparecer aquí y no podrá volver a entrar con el mismo nombre hasta registrarse de nuevo.`)) {
      return;
    }
    setData({
      ...data,
      people: (data.people || []).filter((p) => p.id !== person.id),
      follows: (data.follows || []).filter((f) => f.followerId !== person.id && f.followingId !== person.id),
    });
  };

  const toggleFollow = (targetId) => {
    const exists = follows.some((f) => f.followerId === user.id && f.followingId === targetId);
    const next = exists
      ? follows.filter((f) => !(f.followerId === user.id && f.followingId === targetId))
      : [...follows, { followerId: user.id, followingId: targetId }];
    setData({ ...data, follows: next });
  };

  const openSend = (id) => {
    setOpenId(openId === id ? null : id);
    setAmount("");
    setFormError("");
  };

  const sendPoints = (person) => {
    const amt = parseInt(amount, 10);
    if (!amt || amt <= 0) return setFormError("Escribe una cantidad válida.");
    if (!isGranter && amt > balance) return setFormError("No tienes suficientes puntos.");

    const entry = { id: uid(), fromId: user.id, fromName: user.name, toId: person.id, toName: person.name, amount: amt, at: Date.now() };
    setData(
      isGranter
        ? { ...data, grants: [...(data.grants || []), entry] }
        : { ...data, transfers: [...(data.transfers || []), entry] }
    );
    setOpenId(null);
    setAmount("");
  };

  const recent = [
    ...(data.grants || []).map((g) => ({ ...g, kind: "grant" })),
    ...(data.transfers || []).map((t) => ({ ...t, kind: "transfer" })),
  ]
    .filter((r) => r.fromId === user.id || r.toId === user.id)
    .sort((a, b) => b.at - a.at)

  const grouped = ["dueno", "maestro", "estudiante"]
    .map((role) => ({ role, list: people.filter((p) => p.role === role) }))
    .filter((g) => g.list.length > 0);

    <div>
      <Card style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
        <div style={{ color: COLORS.inkSoft, fontSize: 13 }}>
          Sigues a <strong style={{ color: COLORS.ink }}>{followingSet.size}</strong> · Te siguen{" "}
          <strong style={{ color: COLORS.ink }}>{followerCount}</strong>
        </div>
        {isGranter && (
          <div style={{ ...font.mono, fontSize: 11, color: COLORS.green }} className="uppercase">
            Puedes dar puntos libremente
          </div>
        )}
      </Card>

      {grouped.length === 0 && <EmptyState icon={Users} text="Todavía no hay nadie más registrado. En cuanto otras personas entren a la página, aparecerán aquí." />}

            <Card key={p.id}>
              <div className="flex items-center justify-between gap-2 flex-wrap">
                <span style={{ color: COLORS.ink, fontSize: 14 }}>{p.name}</span>
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => toggleFollow(p.id)}
                    className="px-2 py-1 rounded-md text-xs flex items-center gap-1 transition"
                    style={{
                      border: `1px solid ${COLORS.green}`,
                      color: followingSet.has(p.id) ? COLORS.white : COLORS.green,
                      background: followingSet.has(p.id) ? COLORS.green : "transparent",
                    }}
                  >
                    {followingSet.has(p.id) ? <UserCheck size={13} /> : <UserPlus size={13} />}
                    {followingSet.has(p.id) ? "Siguiendo" : "Seguir"}
                  </button>
                  <button onClick={() => openSend(p.id)} className="px-2 py-1 rounded-md text-xs flex items-center gap-1" style={outlineBtnStyle(COLORS.gold)}>
                    <Send size={13} />
                    {isGranter ? "Dar puntos" : "Pasar puntos"}
                  </button>
                  {isOwner && (
                    <button
                      onClick={() => deletePerson(p)}
                      className="px-2 py-1 rounded-md text-xs flex items-center gap-1"
                      style={outlineBtnStyle(COLORS.red)}
                      title="Eliminar persona"
                    >
                      <Trash2 size={13} />

              </div>

              {openId === p.id && (
                <div className="mt-3 pt-3 flex items-center gap-2 flex-wrap" style={{ borderTop: `1px dashed ${COLORS.line}` }}>
                  <input
                    type="number"
                    min="1"
                    value={amount}
                    onChange={(e) => {
                      setAmount(e.target.value);
                      setFormError("");
                    }}
                    placeholder="Cantidad"
                    className="p-2 rounded-md outline-none w-28"
                    style={inputStyle}
                  />
                  <button onClick={() => sendPoints(p)} className="px-3 py-2 rounded-md text-xs" style={goldBtnStyle(true)}>
                    Confirmar
                  </button>
                  {formError && (
                    <p style={{ color: COLORS.red, fontSize: 12 }} className="w-full">
                      {formError}
                    </p>
                  )}
                </div>
              )}
            </Card>
          ))}
        </div>
      ))}

      {recent.length > 0 && (
        <div className="mt-6">
          <Eyebrow>Movimientos recientes</Eyebrow>
          {recent.map((r) => (
            <Card key={r.id}>
              <div className="flex items-center justify-between text-sm">
                <span style={{ color: COLORS.ink }}>
                  {r.fromId === user.id ? `Le diste ${r.amount} a ${r.toName}` : `${r.fromName} te dio ${r.amount} puntos`}
                </span>
                <PointsBadge points={r.amount} />
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------- MAESTRO ---------------- */

function TeacherView({ data, setData, user, tab }) {
  const [title, setTitle] = useState("");
  const [desc, setDesc] = useState("");
  const [points, setPoints] = useState("");
  const [dueAt, setDueAt] = useState("");
  const [pointsError, setPointsError] = useState("");

  const myTasks = data.tasks.filter((t) => t.createdBy === user.id);
  const pending = data.submissions.filter(
    (s) => s.status === "pendiente" && data.tasks.some((t) => t.id === s.taskId && t.createdBy === user.id)
  );

  const createTask = () => {
    if (!title.trim() || !points) return;
    const pts = parseInt(points, 10);
    if (!pts || pts <= 0) return;
    if (pts > MAX_TASK_POINTS) {
      setPointsError(`El máximo por tarea es ${MAX_TASK_POINTS} puntos.`);
      return;
    }
    const task = {
      id: uid(),
      title: title.trim(),
      description: desc.trim(),
      points: pts,
      dueAt: dueAt ? new Date(dueAt).getTime() : null,
      createdBy: user.id,
      createdByName: user.name,
      at: Date.now(),
    };
    setData({ ...data, tasks: [...data.tasks, task] });
    setTitle("");
    setDesc("");
    setPoints("");
    setDueAt("");
    setPointsError("");
  };

  const deleteTask = (id) => setData({ ...data, tasks: data.tasks.filter((t) => t.id !== id) });

  const decideSubmission = (sub, status) =>
    setData({
      ...data,
      submissions: data.submissions.map((s) => (s.id === sub.id ? { ...s, status, reviewedAt: Date.now() } : s)),
    });

  if (tab === "personas") return <PeopleTab data={data} setData={setData} user={user} />;

  return (
    <div>
      <Card>
        <Eyebrow>Nueva tarea</Eyebrow>
        <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Título de la tarea" className="w-full p-3 rounded-md mb-2 outline-none" style={inputStyle} />
        <textarea value={desc} onChange={(e) => setDesc(e.target.value)} placeholder="Descripción (opcional)" rows={2} className="w-full p-3 rounded-md mb-2 outline-none" style={inputStyle} />
        <label style={{ ...font.mono, fontSize: 11, color: COLORS.inkSoft, letterSpacing: 1 }} className="uppercase block mb-1">
          Fecha y hora límite (opcional)
        </label>
        <input
          type="datetime-local"
          value={dueAt}
          onChange={(e) => setDueAt(e.target.value)}
          className="w-full p-3 rounded-md mb-2 outline-none"
          style={inputStyle}
        />
        <div className="flex items-center gap-2 flex-wrap">
          <input
            type="number"
            min="1"
            max={MAX_TASK_POINTS}
            value={points}
            onChange={(e) => {
              setPoints(e.target.value);
              setPointsError("");
            }}
            placeholder={`Puntos (máx ${MAX_TASK_POINTS})`}
            className="p-3 rounded-md outline-none w-40"
            style={inputStyle}
          />
          <button onClick={createTask} className="px-4 py-3 rounded-md text-sm flex items-center gap-1" style={primaryBtnStyle(!!title.trim() && !!points)}>
            <Plus size={15} /> Crear tarea
          </button>
        </div>
        {pointsError && (
          <p style={{ color: COLORS.red, fontSize: 12 }} className="mt-2">
            {pointsError}
          </p>
        )}
      </Card>

      {pending.length > 0 && (
        <div className="mb-4">
          <Eyebrow>Entregas por revisar</Eyebrow>
          {pending.map((s) => (
            <Card key={s.id}>
              <div className="flex items-center justify-between gap-2 flex-wrap">
                <div>
                  <div style={{ ...font.display, color: COLORS.ink, fontSize: 16, fontWeight: 700 }}>{s.taskTitle}</div>
                  <div style={{ color: COLORS.inkSoft, fontSize: 12 }}>
                    {s.studentName} · {s.points} pts
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <button onClick={() => decideSubmission(s, "aprobado")} className="p-2 rounded-md" style={{ background: COLORS.green, color: COLORS.white }} title="Aprobar">
                    <Check size={15} />
                  </button>
                  <button onClick={() => decideSubmission(s, "rechazado")} className="p-2 rounded-md" style={{ background: COLORS.red, color: COLORS.white }} title="Rechazar">
                    <X size={15} />
                  </button>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}

      <Eyebrow>Tus tareas</Eyebrow>
      {myTasks.length === 0 && <EmptyState icon={ClipboardList} text="Aún no has creado ninguna tarea." />}
      {myTasks
        .slice()
        .sort((a, b) => b.at - a.at)
        .map((t) => (
          <Card key={t.id}>
            <div className="flex items-center justify-between gap-2">
              <div>
                <div style={{ ...font.display, color: COLORS.ink, fontSize: 16, fontWeight: 700 }}>{t.title}</div>
                {t.description && <div style={{ color: COLORS.inkSoft, fontSize: 12 }}>{t.description}</div>}
                <DueLabel dueAt={t.dueAt} />
              </div>
              <div className="flex items-center gap-2">
                <PointsBadge points={t.points} />
                <button onClick={() => deleteTask(t.id)} style={{ color: COLORS.red }} title="Eliminar tarea">
                  <Trash2 size={15} />
                </button>
              </div>
            </div>
          </Card>
        ))}
    </div>
  );
}

/* ---------------- ESTUDIANTE ---------------- */

function StudentView({ data, setData, user, tab }) {
  const balance = getBalance(data, user.id);
  const mySubmissions = data.submissions
    .filter((s) => s.studentId === user.id)
    .sort((a, b) => b.at - a.at);

  const hasActiveSubmission = (taskId) =>
    mySubmissions.some((s) => s.taskId === taskId && (s.status === "pendiente" || s.status === "aprobado"));

  const submitTask = (task) => {
    if (hasActiveSubmission(task.id)) return;
    const submission = {
      id: uid(),
      studentId: user.id,
      studentName: user.name,
      taskId: task.id,
      taskTitle: task.title,
      points: task.points,
      status: "pendiente",
      at: Date.now(),
    };
    setData({ ...data, submissions: [...data.submissions, submission] });
  };

  const redeem = (reward) => {
    if (balance < reward.cost) return;
    const redemption = {
      id: uid(),
      studentId: user.id,
      studentName: user.name,
      rewardId: reward.id,
      rewardName: reward.name,
      cost: reward.cost,
      status: "pendiente",
      at: Date.now(),
    };
    setData({ ...data, redemptions: [...data.redemptions, redemption] });
  };

  if (tab === "personas") return <PeopleTab data={data} setData={setData} user={user} />;

  if (tab === "entregas") {
    return (
      <div>
        <Eyebrow>Mis entregas</Eyebrow>
        {mySubmissions.length === 0 && <EmptyState icon={Inbox} text="Todavía no has entregado ninguna tarea." />}
        {mySubmissions.map((s) => (
          <Card key={s.id}>
            <div className="flex items-center justify-between gap-2 flex-wrap">
              <div>
                <div style={{ ...font.display, color: COLORS.ink, fontSize: 16, fontWeight: 700 }}>{s.taskTitle}</div>
                <div style={{ color: COLORS.inkSoft, fontSize: 12 }}>{s.points} pts</div>
              </div>
              <StampBadge status={s.status} />
            </div>
          </Card>
        ))}
      </div>
    );
  }

  if (tab === "canjes") {
    const myRedemptions = data.redemptions
      .filter((r) => r.studentId === user.id)
      .sort((a, b) => b.at - a.at);
    return (
      <div>
        <Eyebrow>Mis canjes</Eyebrow>
        {myRedemptions.length === 0 && <EmptyState icon={Gift} text="Todavía no has canjeado ningún premio." />}
        {myRedemptions.map((r) => (
          <Card key={r.id}>
            <div className="flex items-center justify-between gap-2 flex-wrap">
              <div>
                <div style={{ ...font.display, color: COLORS.ink, fontSize: 16, fontWeight: 700 }}>{r.rewardName}</div>
                <div style={{ ...font.mono, color: COLORS.gold, fontSize: 12 }}>{r.cost} pts</div>
                {r.status === "rechazado" && (
                  <div style={{ color: COLORS.inkSoft, fontSize: 11, marginTop: 2 }}>Se te devolvieron los puntos.</div>
                )}
              </div>
              <StampBadge status={r.status} />
            </div>
          </Card>
        ))}
      </div>
    );
  }

  if (tab === "premios") {
    const total = getTotalEarned(data, user.id);
    const rank = getRank(total);
    const nextReward = data.rewards
      .filter((r) => r.cost > balance)
      .sort((a, b) => a.cost - b.cost)[0];

    return (
      <div>
        <Card style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ color: COLORS.inkSoft, fontSize: 13 }}>Tu saldo actual</span>
          <PointsBadge points={balance} />
        </Card>

        <Eyebrow>Tu progreso</Eyebrow>
        <ProgressCard
          icon={<span style={{ fontSize: 20 }}>{rank.icon}</span>}
          color="#4C8FE0"
          title={rank.name}
          subtitle={rank.next ? `Faltan ${rank.next.min - total} pts para ${rank.next.name}` : "Alcanzaste el rango máximo"}
          progress={rank.progress}
        />
        {nextReward && (
          <ProgressCard
            icon={<Gift size={18} color={COLORS.white} />}
            color={COLORS.pink}
            title={nextReward.name}
            subtitle={`Te faltan ${nextReward.cost - balance} pts para canjearlo`}
            progress={balance / nextReward.cost}
          />
        )}

        <Eyebrow>Premios disponibles</Eyebrow>
        {data.rewards.length === 0 && <EmptyState icon={Gift} text="Todavía no hay premios cargados." />}
        <div className="grid grid-cols-2 gap-3">
          {data.rewards.map((r, i) => {
            const canAfford = balance >= r.cost;
            return (
              <div
                key={r.id}
                className="rounded-xl p-3 flex flex-col items-center text-center gap-1.5"
                style={{ background: COLORS.paperDark, border: `1px solid ${COLORS.line}`, opacity: canAfford ? 1 : 0.55 }}
              >
                <RewardIcon color={rewardColor(i)} />
                <div style={{ color: COLORS.ink, fontSize: 13, fontWeight: 600, lineHeight: 1.25 }}>{r.name}</div>
                <div style={{ ...font.mono, color: COLORS.gold, fontSize: 12 }}>{r.cost} pts</div>
                <button
                  onClick={() => redeem(r)}
                  className="w-full py-2 rounded-md text-xs flex items-center justify-center gap-1 mt-1"
                  style={goldBtnStyle(canAfford)}
                  disabled={!canAfford}
                >
                  <Gift size={12} /> Canjear
                </button>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // tab === "tareas"
  return (
    <div>
      <Eyebrow>Tareas disponibles</Eyebrow>
      {data.tasks.length === 0 && <EmptyState icon={ClipboardList} text="Todavía no hay tareas asignadas." />}
      {data.tasks
        .slice()
        .sort((a, b) => b.at - a.at)
        .map((t) => {
          const active = hasActiveSubmission(t.id);
          const mySub = mySubmissions.find((s) => s.taskId === t.id && (s.status === "pendiente" || s.status === "aprobado"));
          return (
            <Card key={t.id}>
              <div className="flex items-center justify-between gap-2 flex-wrap">
                <div>
                  <div style={{ ...font.display, color: COLORS.ink, fontSize: 16, fontWeight: 700 }}>{t.title}</div>
                  {t.description && <div style={{ color: COLORS.inkSoft, fontSize: 12 }}>{t.description}</div>}
                  <div style={{ color: COLORS.inkSoft, fontSize: 11 }}>Por {t.createdByName}</div>
                  <DueLabel dueAt={t.dueAt} />
                </div>
                <div className="flex items-center gap-2">
                  <PointsBadge points={t.points} />
                  {active ? (
                    <StampBadge status={mySub.status} />
                  ) : (
                    <button onClick={() => submitTask(t)} className="px-3 py-2 rounded-md text-xs flex items-center gap-1" style={primaryBtnStyle(true)}>
                      <Send size={13} /> Entregar
                    </button>
                  )}
                </div>
              </div>
            </Card>
          );
        })}
    </div>
  );
}

/* ---------------- DUEÑO ---------------- */

function OwnerView({ data, setData, user, tab }) {
  const [rName, setRName] = useState("");
  const [rCost, setRCost] = useState("");

  const addReward = () => {
    if (!rName.trim() || !rCost || parseInt(rCost, 10) <= 0) return;
    setData({ ...data, rewards: [...data.rewards, { id: uid(), name: rName.trim(), cost: parseInt(rCost, 10) }] });
    setRName("");
    setRCost("");
  };

  const deleteReward = (id) => setData({ ...data, rewards: data.rewards.filter((r) => r.id !== id) });

  const decideRedemption = (r, status) =>
    setData({
      ...data,
      redemptions: data.redemptions.map((x) => (x.id === r.id ? { ...x, status, reviewedAt: Date.now() } : x)),
    });

  if (tab === "personas") return <PeopleTab data={data} setData={setData} user={user} />;

  if (tab === "canjes") {
    const sorted = data.redemptions.slice().sort((a, b) => {
      if (a.status === "pendiente" && b.status !== "pendiente") return -1;
      if (b.status === "pendiente" && a.status !== "pendiente") return 1;
      return b.at - a.at;
    });
    return (
      <div>
        <Eyebrow>Canjes de premios</Eyebrow>
        {sorted.length === 0 && <EmptyState icon={Gift} text="Todavía no hay canjes solicitados." />}
        {sorted.map((r) => (
          <Card key={r.id}>
            <div className="flex items-center justify-between gap-2 flex-wrap">
              <div>
                <div style={{ ...font.display, color: COLORS.ink, fontSize: 16, fontWeight: 700 }}>{r.rewardName}</div>
                <div style={{ color: COLORS.inkSoft, fontSize: 12 }}>
                  {r.studentName} · {r.cost} pts
                </div>
              </div>
              {r.status === "pendiente" ? (
                <div className="flex items-center gap-2">
                  <button onClick={() => decideRedemption(r, "aprobado")} className="p-2 rounded-md" style={{ background: COLORS.green, color: COLORS.white }} title="Aprobar">
                    <Check size={15} />
                  </button>
                  <button onClick={() => decideRedemption(r, "rechazado")} className="p-2 rounded-md" style={{ background: COLORS.red, color: COLORS.white }} title="Rechazar">
                    <X size={15} />
                  </button>
                </div>
              ) : (
                <StampBadge status={r.status} />
              )}
            </div>
          </Card>
        ))}
      </div>
    );
  }

  // tab === "premios"
  return (
    <div>
      <Card>
        <Eyebrow>Nuevo premio</Eyebrow>
        <input value={rName} onChange={(e) => setRName(e.target.value)} placeholder="Nombre del premio" className="w-full p-3 rounded-md mb-2 outline-none" style={inputStyle} />
        <div className="flex items-center gap-2 flex-wrap">
          <input
            type="number"
            min="1"
            value={rCost}
            onChange={(e) => setRCost(e.target.value)}
            placeholder="Costo en puntos"
            className="p-3 rounded-md outline-none w-40"
            style={inputStyle}
          />
          <button onClick={addReward} className="px-4 py-3 rounded-md text-sm flex items-center gap-1" style={primaryBtnStyle(!!rName.trim() && !!rCost)}>
            <Plus size={15} /> Agregar premio
          </button>
        </div>
      </Card>

      <Eyebrow>Premios actuales</Eyebrow>
      {data.rewards.length === 0 && <EmptyState icon={Gift} text="Todavía no hay premios cargados." />}
      {data.rewards.map((r, i) => (
        <Card key={r.id}>
          <div className="flex items-center justify-between gap-2">
            <div className="flex items-center gap-3">
              <RewardIcon color={rewardColor(i)} size={36} />
              <div>
                <div style={{ ...font.display, color: COLORS.ink, fontSize: 16, fontWeight: 700 }}>{r.name}</div>
                <div style={{ ...font.mono, color: COLORS.gold, fontSize: 12 }}>{r.cost} pts</div>
              </div>
            </div>
            <button onClick={() => deleteReward(r.id)} style={{ color: COLORS.red }} title="Eliminar premio">
              <Trash2 size={15} />
            </button>
          </div>
        </Card>
      ))}
    </div>
  );
}


try {
  ReactDOM.render(React.createElement(App), document.getElementById("root"));

  showError("Error al iniciar la app:\n" + (e && e.message ? e.message : String(e)));
}
